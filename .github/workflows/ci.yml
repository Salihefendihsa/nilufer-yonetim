name: CI

on:
  pull_request:
  # Yalnız main değil, tüm dallara push (çalışma dalları dahil) — PR açılmadan da doğrulanır.
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Test APK için telefondan erişilebilir geliştirme API adresi (USB adb reverse için localhost kalabilir)"
        required: false
        default: "http://localhost:4000"
        type: string

permissions:
  contents: read

# Aynı dal/PR için yeni push eski çalışmayı iptal eder.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nilufer
          POSTGRES_PASSWORD: nilufer_ci
          POSTGRES_DB: nilufer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nilufer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nilufer:nilufer_ci@localhost:5432/nilufer_ci?schema=public
      JWT_SECRET: ci_test_secret_not_for_production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Android eklentisi (AGP 9.x) ve Gradle 9 için JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # pubspec.yaml `sdk: ^3.13.0` → Dart 3.13 gerektirir; Flutter 3.47.x stable Dart 3.13.x ile gelir.
      # Sürüm sabitlenir (kayan "stable" derlemeyi kendiliğinden bozmasın); yükseltme bilinçli bir commit'tir.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Hata ve uyarı derlemeyi düşürür; mevcut 81 stil (info) uyarısı henüz temizlenmediği
      # için yalnız info seviyesi bilgi amaçlıdır (bkz. analysis_options.yaml).
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Push/PR derlemesi localhost ile yalnız derleme kontrolüdür. Fiziksel cihaz
      # için workflow_dispatch api_url girdisi veya USB'de adb reverse gerekir.
      # İsteğe bağlı MOBILE_APP_SECRET_TEST yalnız manuel test derlemesinde
      # kullanılır. APK içinden çıkarılabilir; üretim sırrı eklenmemelidir.
      - name: Debug APK derle
        env:
          API_URL: ${{ inputs.api_url || 'http://localhost:4000' }}
          MOBILE_APP_SECRET_TEST: ${{ github.event_name == 'workflow_dispatch' && secrets.MOBILE_APP_SECRET_TEST || '' }}
        run: |
          args=(--debug "--dart-define=API_URL=$API_URL")
          if [ -n "$MOBILE_APP_SECRET_TEST" ]; then
            args+=("--dart-define=MOBILE_APP_SECRET=$MOBILE_APP_SECRET_TEST")
          fi
          flutter build apk "${args[@]}"
      - name: Test APK artifactini yükle
        uses: actions/upload-artifact@v4
        with:
          name: nilufer-mobile-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
