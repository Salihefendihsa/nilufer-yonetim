name: CI

on:
  pull_request:
  # Yalnız main değil, tüm dallara push (çalışma dalları dahil) — PR açılmadan da doğrulanır.
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Aynı dal/PR için yeni push eski çalışmayı iptal eder.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nilufer
          POSTGRES_PASSWORD: nilufer_ci
          POSTGRES_DB: nilufer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nilufer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nilufer:nilufer_ci@localhost:5432/nilufer_ci?schema=public
      JWT_SECRET: ci_test_secret_not_for_production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Android eklentisi (AGP 9.x) ve Gradle 9 için JDK 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # pubspec.yaml `sdk: ^3.13.0` → Dart 3.13 gerektirir; Flutter 3.47.x stable Dart 3.13.x ile gelir.
      # Sürüm sabitlenir (kayan "stable" derlemeyi kendiliğinden bozmasın); yükseltme bilinçli bir commit'tir.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Hata ve uyarı derlemeyi düşürür; mevcut 81 stil (info) uyarısı henüz temizlenmediği
      # için yalnız info seviyesi bilgi amaçlıdır (bkz. analysis_options.yaml).
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Gerçek servis anahtarı / üretim adresi yok: sahte yerel API adresi, MOBILE_APP_SECRET geçilmez.
      - run: flutter build apk --debug --dart-define=API_URL=http://localhost:4000
